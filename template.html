<!-- === HEADER === -->
<div class="signage-header">
    <div class="route-title">{start_stop} &nbsp;➔&nbsp; {end_stop}</div>
</div>
<div class="col-headers">
    <div>時刻</div>
    <div>系統</div>
    <div class="hdr-dest">行先</div>
    <div>遅れ</div>
    <div>備考</div>
</div>

<!-- === TOP_ITEM === -->
<div class="bus-row-card">
    <div class="dep-time">{dep_time}</div>
    <div><div class="line-box {line_bg_class}">{line_str}</div></div>
    <div class="dest-name">{destination}</div>
    <div class="delay-text {rem_color_class}">{minute_str}</div>
    <div class="remark-text">{remark_html}</div>
</div>
<div class="detail-location-bar">
    <div class="detail-tag">走行位置</div>
    <div class="detail-location-val">{status}</div>
</div>
<div class="detail-bottom-grid">
    <div class="arrival-and-stops">
        {arrival_html}
        <details class="stops-expander">
            <summary>停車バス停を見る</summary>
            <div class="stops-content">{stops_str}</div>
        </details>
    </div>
    <div class="est-time-box">
        <div class="est-times-col">
            <div class="{pro_color_class}">{pro_dep_time}</div>
            <div class="{pro_color_class}">{pro_arr_time}</div>
        </div>
        <div class="route-line-graphic">
            <div class="route-dot"></div>
            <div class="route-bar"></div>
            <div class="route-dot"></div>
        </div>
        <div class="est-stops-col">
            <div>{start_stop}</div>
            <div>{end_stop}</div>
        </div>
    </div>
</div>

<!-- === BOTTOM_ITEM === -->
<div class="bus-row-card">
    <div class="dep-time">{dep_time}</div>
    <div><div class="line-box {line_bg_class}">{line_str}</div></div>
    <div class="dest-name">{destination}</div>
    <div class="delay-text {rem_color_class}">{minute_str}</div>
    <div class="remark-text">{remark_html}</div>
</div>

<!-- === MESSAGE_ROW === -->
<div class="bus-row-card">
    <div class="msg-row-text {msg_color_class}">{message}</div>
</div>
